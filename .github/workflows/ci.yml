name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schemaforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schemaforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SF_USE_CI_POSTGRES: 'true'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schemaforge_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests (if script exists)
        run: |
          if npm run | grep -q "^  test"; then
            npm test -- --exclude test/drift-realdb.integration.test.ts
          else
            echo "No test script found. Skipping tests."
          fi

      - name: Run drift integration tests against real postgres
        run: npm run test:integration:drift

      - name: Build
        run: npm run build
